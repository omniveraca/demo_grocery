<html lang="en" data-theme="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11130f" />
    <meta name="description" content="Downtown Demo Market, a front-end grocery shopping demo." />
    <meta property="og:type" content="website" />

    <title>Downtown Demo Market</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('downtown-demo-market:v1'));
        document.documentElement.dataset.theme = saved?.theme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
